<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Where the five senses land</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font:16px/1.5 system-ui,sans-serif}
header{padding:18px 22px 6px}
h1{font-size:20px;margin:0 0 6px}
p.note{margin:0;color:#9aa7b4;font-size:14px;max-width:660px}
#wrap{position:relative;height:68vh;min-height:400px}
canvas{display:block}
#info{position:absolute;left:22px;bottom:18px;background:#161b22cc;border:1px solid #30363d;border-radius:8px;padding:10px 14px;font-size:14px;max-width:330px}
#info b{color:#58a6ff}
#legend{position:absolute;right:18px;top:14px;font-size:13px;background:#161b22cc;border:1px solid #30363d;border-radius:8px;padding:10px 12px}
#legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
<header>
<h1>Where the five senses land in the brain</h1>
<p class=note>Drag to turn it. Click a coloured patch to name it. The shell is see-through on purpose: two of these sit inside folds and one is on the underside, so no single angle shows all five. Stylized diagram, not a scan.</p>
</header>
<div id=wrap><div id=info>Drag to rotate. Click a patch.</div><div id=legend></div></div>
<script src=three.min.js></script>
<script>
const W=document.getElementById('wrap');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
W.appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(45,1,0.1,100);
C.position.set(0,0,7);
function size(){const w=W.clientWidth,h=W.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix();}
size();addEventListener('resize',size);
S.add(new THREE.AmbientLight(0xffffff,0.8));
const d1=new THREE.DirectionalLight(0xffffff,1.1);d1.position.set(3,4,5);S.add(d1);
const d2=new THREE.DirectionalLight(0x88aaff,0.55);d2.position.set(-4,-2,-3);S.add(d2);
const brain=new THREE.Group();S.add(brain);
const shellMat=new THREE.MeshPhongMaterial({color:0x9fb4c7,transparent:true,opacity:0.15,shininess:25,depthWrite:false,side:THREE.DoubleSide});
for(const sx of [-1,1]){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),shellMat);
  m.scale.set(1.05,1.25,1.55);m.position.x=sx*0.98;brain.add(m);
}
const wire=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshBasicMaterial({color:0x3d5a73,wireframe:true,transparent:true,opacity:0.1}));
wire.scale.set(2.05,1.25,1.55);brain.add(wire);
const senses=[
 {k:'Sight',c:0x4ea1ff,p:[-0.10,-0.02,-1.12],s:[0.30,0.22,0.14],d:'V1, back of the head, on the inner face inside the calcarine groove. Buried — no outside angle shows it.'},
 {k:'Hearing',c:0xffb454,p:[1.92,0.02,0.10],s:[0.20,0.26,0.30],d:'Heschl gyrus, side of the head, sunk inside the lateral fold.'},
 {k:'Touch',c:0x5ad48a,p:[0.92,1.14,-0.10],s:[0.26,0.16,0.62],d:'The postcentral strip over the top. The most exposed of the five.'},
 {k:'Taste',c:0xd07bff,p:[1.42,-0.30,0.18],s:[0.22,0.18,0.22],d:'Insula, deep under the temporal lobe. The least reachable of the five.'},
 {k:'Smell',c:0xff7b7b,p:[0.72,-1.02,0.58],s:[0.26,0.16,0.34],d:'Piriform cortex, on the underside. It skips the thalamus entirely.'}
];
const patches=[];
for(const s of senses){
  for(const sx of [1,-1]){
    const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshPhongMaterial({color:s.c,emissive:s.c,emissiveIntensity:0.4,transparent:true,opacity:0.92}));
    m.position.set(sx*s.p[0],s.p[1],s.p[2]);m.scale.fromArray(s.s);m.userData=s;
    brain.add(m);patches.push(m);
  }
}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let drag=false,px=0,py=0,rx=0,ry=0;
const el=R.domElement;
el.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup',()=>{drag=false;});
el.addEventListener('pointermove',e=>{
  if(!drag)return;
  ry+=(e.clientX-px)*0.008;rx+=(e.clientY-py)*0.008;
  rx=Math.max(-1.3,Math.min(1.3,rx));
  px=e.clientX;py=e.clientY;
});
el.addEventListener('click',e=>{
  const r=el.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,C);
  const hit=ray.intersectObjects(patches,false);
  const box=document.getElementById('info');
  if(hit.length){
    const s=hit[0].object.userData;
    box.innerHTML='<b style="color:#'+s.c.toString(16).padStart(6,'0')+'">'+s.k+'</b><br>'+s.d;
  }
});
const legend=document.getElementById('legend');
for(const s of senses){
  const row=document.createElement('div');
  row.innerHTML='<span class=sw style="background:#'+s.c.toString(16).padStart(6,'0')+'"></span>'+s.k;
  legend.appendChild(row);
}
function tick(){
  requestAnimationFrame(tick);
  brain.rotation.y+=(ry-brain.rotation.y)*0.12;
  brain.rotation.x+=(rx-brain.rotation.x)*0.12;
  R.render(S,C);
}
tick();
</script>
</html>
